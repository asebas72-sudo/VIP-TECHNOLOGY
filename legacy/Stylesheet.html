<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap');

  :root{
    --color-bg:#E9EEF1;
    --color-surface:#FFFFFF;
    --color-surface-alt:#F3F6F8;
    --color-ink:#16202B;
    --color-ink-muted:#5B6672;
    --color-accent:#1E6F6B;
    --color-accent-dark:#134E4B;
    --color-accent-soft:#DCEEEC;
    --color-tag:#E8A33D;
    --color-tag-dark:#B97A1C;
    --color-danger:#C0392B;
    --color-danger-soft:#FBE8E5;
    --color-border:#D7DEE3;
    --radius-card:18px;
    --radius-input:10px;
    --shadow-card:0 10px 28px rgba(22,32,43,.10);
    --shadow-card-hover:0 16px 36px rgba(22,32,43,.16);
    --font-display:'Space Grotesk',sans-serif;
    --font-body:'Inter',sans-serif;
    --font-mono:'IBM Plex Mono',monospace;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--color-bg);
    color:var(--color-ink);
    font-family:var(--font-body);
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3{font-family:var(--font-display); margin:0; letter-spacing:-.01em;}
  p{margin:0;}
  button{font-family:var(--font-body); cursor:pointer;}
  :focus-visible{outline:3px solid var(--color-accent); outline-offset:2px; border-radius:6px;}

  .app-shell{max-width:880px; margin:0 auto; padding:20px 18px 60px;}

  .app-header{
    display:flex; align-items:center; gap:12px;
    padding:6px 4px 22px;
  }
  .brand-mark{
    width:42px; height:42px; border-radius:11px;
    background:var(--color-accent); color:#fff;
    display:flex; align-items:center; justify-content:center;
    font-size:20px; flex:none;
  }
  .brand-title{display:block; font-family:var(--font-display); font-weight:700; font-size:18px;}
  .brand-sub{display:block; font-size:12.5px; color:var(--color-ink-muted);}

  /* ---------- MENU PRINCIPAL ---------- */
  .menu-intro{padding:6px 4px 22px;}
  .menu-intro h1{font-size:26px; font-weight:700; margin-bottom:6px;}
  .menu-intro p{color:var(--color-ink-muted); font-size:14.5px;}

  .card-grid{
    display:grid; grid-template-columns:repeat(3,1fr); gap:16px;
  }
  @media (max-width:720px){ .card-grid{grid-template-columns:1fr;} }

  .tag-card{
    position:relative;
    background:var(--color-surface);
    border:1px solid var(--color-border);
    border-radius:var(--radius-card);
    padding:30px 18px 22px;
    text-align:left;
    box-shadow:var(--shadow-card);
    transition:transform .18s ease, box-shadow .18s ease, rotate .18s ease;
    display:flex; flex-direction:column; gap:8px;
    width:100%;
  }
  .tag-card:hover{transform:translateY(-4px) rotate(-0.6deg); box-shadow:var(--shadow-card-hover);}
  .tag-card:active{transform:translateY(-1px);}
  .tag-hole{
    position:absolute; top:14px; left:18px;
    width:14px; height:14px; border-radius:50%;
    background:var(--color-bg); border:2px solid var(--color-border);
  }
  .tag-card::after{
    content:''; position:absolute; top:25px; left:0; right:0;
    border-top:1.5px dashed var(--color-border);
  }
  .tag-icon{font-size:26px; margin-top:6px;}
  .tag-title{font-family:var(--font-display); font-weight:700; font-size:17px;}
  .tag-desc{font-size:13px; color:var(--color-ink-muted); line-height:1.4;}
  .tag-flag{
    align-self:flex-start; margin-top:4px;
    font-size:11px; font-weight:600; letter-spacing:.02em;
    color:var(--color-tag-dark); background:#FBF1E1;
    padding:3px 9px; border-radius:99px;
  }
  .tag-card.is-soon{opacity:.72;}
  .tag-card.is-soon:hover{transform:none; box-shadow:var(--shadow-card);}

  /* ---------- BOTONES ---------- */
  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:8px;
    border:none; border-radius:var(--radius-input);
    font-weight:600; font-size:14.5px; padding:12px 20px;
    transition:filter .15s ease, transform .1s ease;
  }
  .btn:active{transform:scale(.98);}
  .btn-primary{background:var(--color-accent); color:#fff;}
  .btn-primary:hover{filter:brightness(1.07);}
  .btn-primary:disabled{opacity:.6; cursor:not-allowed;}
  .btn-ghost{background:transparent; color:var(--color-ink-muted); padding:10px 6px;}
  .btn-ghost:hover{color:var(--color-ink);}
  .btn-secondary{background:var(--color-surface-alt); color:var(--color-ink); border:1px solid var(--color-border);}

  /* ---------- FORMULARIO DE INGRESO ---------- */
  .page-header{display:flex; align-items:center; gap:10px; margin-bottom:14px;}
  .page-header h2{font-size:21px; font-weight:700;}

  .form-layout{display:grid; grid-template-columns:1fr 270px; gap:18px; align-items:start;}
  @media (max-width:780px){ .form-layout{grid-template-columns:1fr;} }

  .form-card{
    background:var(--color-surface); border:1px solid var(--color-border);
    border-radius:var(--radius-card); padding:22px; box-shadow:var(--shadow-card);
  }

  .field-group{margin-bottom:16px;}
  .field-group label{display:block; font-size:13px; font-weight:600; margin-bottom:6px; color:var(--color-ink);}
  .field-hint{font-size:11.5px; color:var(--color-ink-muted); margin-top:4px;}
  .field-row{display:grid; grid-template-columns:1fr 1fr; gap:14px;}
  @media (max-width:520px){ .field-row{grid-template-columns:1fr;} }

  input[type=text],input[type=tel],input[type=email],select,textarea{
    width:100%; font-family:var(--font-body); font-size:14.5px;
    border:1.5px solid var(--color-border); border-radius:var(--radius-input);
    padding:10px 12px; background:var(--color-surface-alt); color:var(--color-ink);
  }
  textarea{resize:vertical; min-height:70px;}
  input:focus,select:focus,textarea:focus{
    border-color:var(--color-accent); outline:none; background:#fff;
  }

  .chip-group{display:flex; flex-wrap:wrap; gap:8px;}
  .chip{
    display:flex; align-items:center; gap:6px;
    border:1.5px solid var(--color-border); border-radius:99px;
    padding:7px 13px; font-size:13px; background:var(--color-surface-alt);
  }
  .chip input{width:auto; margin:0;}
  .chip:has(input:checked){border-color:var(--color-accent); background:var(--color-accent-soft); color:var(--color-accent-dark);}

  .marca-row{display:flex; align-items:center; gap:10px; margin-top:8px;}
  .marca-logo{
    width:34px; height:34px; border-radius:8px; object-fit:contain;
    background:var(--color-surface-alt); border:1px solid var(--color-border); display:none;
  }

  .section-label{
    font-family:var(--font-mono); font-size:11px; letter-spacing:.06em;
    color:var(--color-ink-muted); text-transform:uppercase; margin:22px 0 10px;
  }

  /* Firma */
  .signature-wrap{
    border:1.5px dashed var(--color-border); border-radius:var(--radius-input);
    background:var(--color-surface-alt); overflow:hidden;
  }
  #firmaCanvas{display:block; width:100%; height:160px; touch-action:none; background:#fff;}
  .signature-actions{display:flex; justify-content:flex-end; padding:8px;}

  /* Foto */
  .photo-drop{
    border:1.5px dashed var(--color-border); border-radius:var(--radius-input);
    background:var(--color-surface-alt); padding:16px; text-align:center;
  }
  .photo-preview{max-width:100%; max-height:160px; border-radius:8px; margin-top:10px; display:none;}

  /* Ticket lateral (vista previa / confirmación) */
  .ticket{
    background:var(--color-ink); color:#fff;
    border-radius:var(--radius-card); padding:20px;
    position:sticky; top:18px;
  }
  .ticket-eyebrow{font-family:var(--font-mono); font-size:11px; letter-spacing:.08em; color:#9FB3AE; text-transform:uppercase;}
  .ticket-row{display:flex; justify-content:space-between; gap:8px; padding:9px 0; border-bottom:1px dashed rgba(255,255,255,.18); font-size:13.5px;}
  .ticket-row:last-child{border-bottom:none;}
  .ticket-row span:first-child{color:#9AA6AE;}
  .ticket-row span:last-child{font-weight:600; text-align:right;}
  .ticket-codigo{
    font-family:var(--font-mono); font-size:22px; font-weight:600;
    background:rgba(255,255,255,.08); border-radius:10px; padding:14px;
    text-align:center; letter-spacing:.03em; margin:14px 0;
  }

  /* Alertas */
  .form-alert{
    border-radius:var(--radius-input); padding:12px 14px; font-size:13.5px;
    margin-bottom:16px;
  }
  .form-alert.error{background:var(--color-danger-soft); color:var(--color-danger);}
  .form-alert.success{background:var(--color-accent-soft); color:var(--color-accent-dark);}
  .form-alert ul{margin:0; padding-left:18px;}

  /* Carga */
  .loading{display:flex; flex-direction:column; align-items:center; gap:12px; padding:60px 0; color:var(--color-ink-muted);}
  .spinner{
    width:28px; height:28px; border-radius:50%;
    border:3px solid var(--color-border); border-top-color:var(--color-accent);
    animation:spin .7s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg);}}

  /* Confirmación final */
  .confirm-wrap{text-align:center; padding:10px 0 4px;}
  .confirm-icon{
    width:56px; height:56px; border-radius:50%; background:var(--color-accent-soft);
    color:var(--color-accent-dark); display:flex; align-items:center; justify-content:center;
    font-size:26px; margin:0 auto 14px;
  }
  .confirm-actions{display:flex; gap:10px; justify-content:center; margin-top:18px; flex-wrap:wrap;}

  .proximamente{
    text-align:center; padding:70px 16px; color:var(--color-ink-muted);
  }
  .proximamente .tag-icon{font-size:38px; display:block; margin-bottom:10px;}
</style>
