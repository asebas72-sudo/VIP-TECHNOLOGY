<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#7e22ce" />
  <link rel="icon" type="image/png" href="/icons/icon-192.png" />
  <title>VIP TECHNOLOGY</title>
  <link rel="stylesheet" href="/src/styles/tailwind.css" />
</head>
<body class="overflow-x-hidden bg-slate-100 text-slate-900 font-sans">

  <!-- Pantalla de login: vista completa e independiente, no un modal encima del menú -->
  <div id="login-screen"
       class="fixed inset-0 z-50 flex min-h-screen items-center justify-center p-4"
       style="background: radial-gradient(circle at top, #9333ea 0%, #581c87 45%, #1e0a33 100%);">
    <div class="w-full max-w-sm">
      <div class="mb-6 flex flex-col items-center text-center">
        <img id="login-logo" alt="VIP Technology" class="mb-3 h-20 w-20 rounded-2xl border-2 border-white/30 object-cover shadow-xl" />
        <span class="text-2xl font-extrabold tracking-wide text-white">VIP TECHNOLOGY</span>
        <span class="text-xs font-medium text-purple-200">Servicio Técnico Especializado</span>
      </div>

      <form id="login-form" class="rounded-2xl bg-white p-8 shadow-2xl">
        <h2 class="text-lg font-extrabold text-slate-900">Iniciar sesión</h2>
        <p class="mb-5 text-sm text-slate-500">Ingresa tus credenciales para continuar</p>

        <div id="login-error" class="mb-3 hidden rounded-md bg-red-50 px-3 py-2 text-sm text-red-600"></div>

        <label class="mb-1 block text-xs font-bold uppercase text-slate-500" for="login-usuario">Usuario</label>
        <input id="login-usuario" type="text" required autocomplete="username" placeholder="Ej: admin"
               class="mb-4 w-full rounded-md border border-slate-300 px-3 py-2.5 text-sm focus:border-accent focus:outline-none focus:ring-2 focus:ring-accent-soft" />

        <label class="mb-1 block text-xs font-bold uppercase text-slate-500" for="login-clave">Contraseña</label>
        <input id="login-clave" type="password" required autocomplete="current-password" placeholder="••••••••"
               class="mb-5 w-full rounded-md border border-slate-300 px-3 py-2.5 text-sm focus:border-accent focus:outline-none focus:ring-2 focus:ring-accent-soft" />

        <button id="login-btn" type="submit"
                class="w-full rounded-md bg-accent py-3 text-sm font-bold text-white shadow-lg shadow-accent/30 transition hover:bg-accent-dark">
          Ingresar
        </button>
      </form>
      <p class="mt-5 text-center text-xs text-purple-200">© VIP TECHNOLOGY — Todos los derechos reservados</p>
    </div>
  </div>

  <!-- Shell de la app: solo visible después de iniciar sesión -->
  <div id="app-shell" class="mx-auto hidden max-w-7xl px-4 pb-16 pt-6 sm:px-6 lg:px-8">
    <header class="mb-6 flex items-center gap-2 rounded-xl border border-slate-200 bg-white px-3 py-2.5 shadow-sm sm:gap-4 sm:px-5 sm:py-3">
      <img id="header-logo" alt="VIP Technology" class="h-9 w-9 flex-shrink-0 rounded-lg border border-slate-200 object-cover sm:h-10 sm:w-10" />
      <div class="flex min-w-0 flex-col">
        <span class="truncate text-sm font-extrabold tracking-wide text-slate-900 sm:text-lg">VIP TECHNOLOGY</span>
        <span class="hidden truncate text-xs font-medium text-slate-500 sm:block">Servicio Técnico Especializado</span>
      </div>
      <span id="user-badge" class="hidden truncate text-xs text-slate-400 md:ml-2 md:inline"></span>
      <button id="logout-btn"
              class="ml-auto flex flex-shrink-0 items-center gap-1.5 rounded-md border border-accent px-2 py-1.5 text-xs font-bold text-accent transition hover:bg-accent hover:text-white sm:px-3">
        <span>🚪</span><span class="hidden sm:inline">Cerrar sesión</span>
      </button>
    </header>

    <main id="main-content"></main>
  </div>

  <script type="module" src="/src/js/main.js"></script>
</body>
</html>
